services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fitness_tracker_service_db_1
      POSTGRES_USER: fitness_tracker_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_tracker_user -d fitness_tracker_service_db_1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: fitness_tracker_mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db
      - ./validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./data.js:/docker-entrypoint-initdb.d/02-data.js:ro

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-consumer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./events:/app:ro
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: fitness_tracker.events
      RABBITMQ_QUEUE: fitness_tracker.audit
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python consumer.py"
    depends_on:
      rabbitmq:
        condition: service_healthy

  event-producer:
    image: python:3.12-slim
    profiles:
      - events
    working_dir: /app
    volumes:
      - ./events:/app:ro
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: fitness_tracker.events
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python producer.py"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_CONNECTION: postgresql://fitness_tracker_user:password@postgres:5432/fitness_tracker_service_db_1
      MONGO_CONNECTION: mongodb://mongo:27017/fitness_tracker_mongo
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  mongo_data:
